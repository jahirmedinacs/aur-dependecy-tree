version: '3'

tasks:
  Default:
    desc: "Run the full Arch Migration Pipeline"
    deps: [SanityCheck]

  Setup:
    desc: "Ensure directories exist and input list is present"
    cmds:
      - mkdir -p bin assets/IntermediateReports report QuickUtils/ToCompare QuickUtils/ToReplicate assets/Consensus
      - bash -c 'if [ ! -s assets/PackagesListParu.txt ]; then echo "Generating package list..."; paru -Qq > assets/PackagesListParu.txt; fi'

  GenerateUncut:
    desc: "Step 1: The Uncut Forest"
    deps: [Setup]
    cmds:
      - bash bin/GeneratingUncutForest.sh

  Prune:
    desc: "Step 2: Pruning the Forest"
    deps: [GenerateUncut]
    cmds:
      - python3 bin/PruningTheForest.py

  FindSuperRoots:
    desc: "Step 3: Finding Super Roots"
    deps: [Prune]
    cmds:
      - python3 bin/FindingSuperRoots.py

  Optimize:
    desc: "Step 4: Optimizing the Forest"
    deps: [FindSuperRoots]
    cmds:
      - python3 bin/OptimizingTheForest.py

  SanityCheck:
    desc: "Step 5: The Sanity Check"
    deps: [Optimize]
    cmds:
      - python3 bin/SanityCheck.py

  # ----------------------------------------
  # Utilities
  # ----------------------------------------
  GenerateConsensus:
    desc: "Utility: Compare host package list against reference replicates to establish core consensus"
    cmds:
      - python3 bin/GenerateConsensus.py

  Compare:
    desc: "Alias for GenerateConsensus"
    deps: [GenerateConsensus]

  PrepareInstallationList:
    desc: "Utility: Flattens the ToInstall consensus JSONs into a single runnable installation text file"
    cmds:
      - python3 bin/PrepareInstallationList.py

  Clean:
    desc: "Clean generated reports and input lists to ensure a pristine state for syncing or committing"
    cmds:
      - rm -rf report/* assets/IntermediateReports/* assets/Consensus/* assets/PackagesListParu.txt

  PrepCommit:
    desc: "Wipe all generated JSON/TXT artifacts before a git commit to ensure a pristine tree"
    deps: [Clean]
